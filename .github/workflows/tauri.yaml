name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.1.1)'
        required: false
        default: 'v1.1.1'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            artifact: 'phira-render-windows-x64.zip'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            artifact: 'phira-render-linux-x64.tar.gz'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libssl-dev pkg-config ffmpeg

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Rust binary
        run: cargo build --release --features custom-protocol --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Package Bundle (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $pkgDir = "dist-windows"
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/phira-render.exe" "$pkgDir/phira-render.exe"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "temp_ffmpeg" -Force
          Copy-Item "temp_ffmpeg/ffmpeg.exe" "$pkgDir/ffmpeg.exe"
          Remove-Item -Recurse -Force "temp_ffmpeg"
          Copy-Item -Recurse -Force "src-tauri/assets" "$pkgDir/assets"
          Copy-Item "README.md" "$pkgDir/README.md"
          Compress-Archive -Path "$pkgDir/*" -DestinationPath "${{ matrix.artifact }}" -Force

      - name: Package Bundle (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p dist-linux
          cp "src-tauri/target/${{ matrix.target }}/release/phira-render" dist-linux/phira-render
          cp -r src-tauri/assets dist-linux/assets
          cp README.md dist-linux/README.md
          tar -czvf "${{ matrix.artifact }}" -C dist-linux .

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: 'Phira Render ${{ github.event.inputs.tag_name || github.ref_name }}'
          files: ${{ matrix.artifact }}
          draft: false
          prerelease: false
